<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="pomBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#111"/>
    </linearGradient>
    <radialGradient id="pomBody" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#e8501b"/>
      <stop offset="60%" stop-color="#c0392b"/>
      <stop offset="100%" stop-color="#8b1a1a"/>
    </radialGradient>
    <radialGradient id="pomHalf" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffcccc"/>
      <stop offset="40%" stop-color="#e8501b"/>
      <stop offset="100%" stop-color="#8b1a1a"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="300" fill="url(#pomBg)"/>
  <!-- Decorative circles -->
  <circle cx="50" cy="260" r="60" fill="rgba(232,80,27,0.08)"/>
  <circle cx="370" cy="40" r="40" fill="rgba(232,80,27,0.06)"/>
  <!-- Whole pomegranate -->
  <ellipse cx="145" cy="165" rx="65" ry="60" fill="url(#pomBody)"/>
  <!-- Crown/calyx -->
  <polygon points="125,108 135,95 145,105 155,93 165,108" fill="#8b1a1a"/>
  <!-- Highlight on whole fruit -->
  <ellipse cx="130" cy="145" rx="20" ry="25" fill="rgba(255,255,255,0.15)"/>
  <!-- Stem -->
  <line x1="145" y1="105" x2="145" y2="90" stroke="#5d4037" stroke-width="3" stroke-linecap="round"/>
  <!-- Leaf -->
  <path d="M145,92 Q160,78 170,85 Q158,92 145,92Z" fill="#4caf50"/>
  <path d="M145,92 Q165,82 170,85" stroke="#2e7d32" stroke-width="0.8" fill="none"/>
  <!-- Cut half pomegranate -->
  <ellipse cx="270" cy="165" rx="65" ry="60" fill="url(#pomHalf)"/>
  <!-- Inner membrane lines -->
  <path d="M270,110 L270,220" stroke="rgba(139,26,26,0.4)" stroke-width="1.5"/>
  <path d="M220,165 L320,165" stroke="rgba(139,26,26,0.4)" stroke-width="1.5"/>
  <path d="M235,125 L305,205" stroke="rgba(139,26,26,0.3)" stroke-width="1"/>
  <path d="M305,125 L235,205" stroke="rgba(139,26,26,0.3)" stroke-width="1"/>
  <!-- Seeds -->
  <circle cx="250" cy="140" r="5" fill="#c0392b" opacity="0.9"/>
  <circle cx="262" cy="132" r="4.5" fill="#d4503a" opacity="0.85"/>
  <circle cx="240" cy="155" r="5" fill="#c0392b" opacity="0.9"/>
  <circle cx="255" cy="150" r="4" fill="#b33a2a" opacity="0.85"/>
  <circle cx="278" cy="145" r="5" fill="#c0392b" opacity="0.9"/>
  <circle cx="290" cy="138" r="4.5" fill="#d4503a" opacity="0.85"/>
  <circle cx="295" cy="155" r="4" fill="#c0392b" opacity="0.8"/>
  <circle cx="248" cy="175" r="5" fill="#d4503a" opacity="0.9"/>
  <circle cx="260" cy="170" r="4.5" fill="#c0392b" opacity="0.85"/>
  <circle cx="275" cy="168" r="5" fill="#b33a2a" opacity="0.9"/>
  <circle cx="288" cy="172" r="4.5" fill="#c0392b" opacity="0.85"/>
  <circle cx="300" cy="165" r="4" fill="#d4503a" opacity="0.8"/>
  <circle cx="245" cy="190" r="4.5" fill="#c0392b" opacity="0.85"/>
  <circle cx="258" cy="188" r="5" fill="#d4503a" opacity="0.9"/>
  <circle cx="272" cy="185" r="4.5" fill="#c0392b" opacity="0.85"/>
  <circle cx="285" cy="190" r="5" fill="#b33a2a" opacity="0.9"/>
  <circle cx="298" cy="185" r="4" fill="#c0392b" opacity="0.8"/>
  <!-- Seed highlights -->
  <circle cx="249" cy="139" r="1.5" fill="rgba(255,255,255,0.4)"/>
  <circle cx="277" cy="144" r="1.5" fill="rgba(255,255,255,0.4)"/>
  <circle cx="259" cy="169" r="1.5" fill="rgba(255,255,255,0.4)"/>
  <circle cx="284" cy="189" r="1.5" fill="rgba(255,255,255,0.4)"/>
  <!-- Crown on cut half -->
  <polygon points="250,108 260,96 270,106 280,94 290,108" fill="#8b1a1a"/>
  <!-- Scattered seeds below -->
  <circle cx="230" cy="245" r="4" fill="#c0392b" opacity="0.6"/>
  <circle cx="245" cy="250" r="3.5" fill="#d4503a" opacity="0.5"/>
  <circle cx="310" cy="240" r="3.5" fill="#c0392b" opacity="0.5"/>
</svg>
