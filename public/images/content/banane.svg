<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="banBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#111"/>
    </linearGradient>
    <linearGradient id="banSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeb3b"/>
      <stop offset="50%" stop-color="#fdd835"/>
      <stop offset="100%" stop-color="#f9a825"/>
    </linearGradient>
    <linearGradient id="banSkin2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdd835"/>
      <stop offset="100%" stop-color="#f57f17"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="300" fill="url(#banBg)"/>
  <!-- Decorative -->
  <circle cx="350" cy="40" r="45" fill="rgba(255,235,59,0.06)"/>
  <circle cx="60" cy="260" r="55" fill="rgba(255,235,59,0.05)"/>
  <!-- Main banana (large, curved) -->
  <path d="M80,200 Q100,100 160,60 Q220,30 280,50 Q310,60 300,80 Q290,60 240,55 Q180,55 130,100 Q95,140 90,200 Q88,210 80,200Z" fill="url(#banSkin)"/>
  <!-- Banana highlight -->
  <path d="M95,185 Q110,110 165,70 Q210,45 260,55 Q250,50 200,55 Q150,65 115,110 Q100,140 95,185Z" fill="rgba(255,255,255,0.2)"/>
  <!-- Banana bottom end -->
  <ellipse cx="83" cy="205" rx="8" ry="5" fill="#f9a825"/>
  <!-- Banana top stem -->
  <path d="M295,65 Q310,55 315,50 Q320,48 318,55 Q312,62 300,70Z" fill="#8d6e63"/>
  <!-- Second banana (behind, slightly offset) -->
  <path d="M100,220 Q115,130 170,85 Q225,50 290,65 Q310,72 302,88 Q292,72 248,68 Q190,70 145,115 Q115,155 108,220 Q106,228 100,220Z" fill="url(#banSkin2)" opacity="0.7"/>
  <!-- Brown spots for realism -->
  <circle cx="150" cy="90" r="2" fill="#795548" opacity="0.3"/>
  <circle cx="200" cy="65" r="1.8" fill="#795548" opacity="0.25"/>
  <circle cx="130" cy="130" r="2.2" fill="#795548" opacity="0.2"/>
  <circle cx="110" cy="170" r="1.5" fill="#795548" opacity="0.25"/>
  <!-- Bunch connector -->
  <path d="M295,65 L290,60 Q300,50 310,52" stroke="#6d4c41" stroke-width="2" fill="none"/>
</svg>
